<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Apoio Vida — Controle de Medicamentos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">AV</div>
      <div>
        <h1>Apoio Vida</h1>
        <div class="sub">Gerencie pacientes e horários de medicamentos</div>
      </div>
    </div>
    <div id="user-area" class="sub"></div>
  </header>

  <main>
    <div id="app-root">
      <!-- Tela de Login -->
      <div id="login-screen" class="card login-box">
        <h2>Entrar</h2>
        <div class="field">
          <label for="login-user">Usuário</label>
          <input id="login-user" type="text" placeholder="admin" />
        </div>
        <div class="field">
          <label for="login-pass">Senha</label>
          <input id="login-pass" type="password" placeholder="senha" />
        </div>
        <div class="actions-end">
          <button class="btn btn-primary" id="btn-login">Entrar</button>
        </div>
      </div>

      <!-- Dashboard -->
      <div id="dashboard" style="display:none">
        <div class="grid">
          <aside class="sidebar">
            <div class="card">
              <div class="header-actions">
                <div>
                  <strong id="home-title">Pacientes</strong>
                  <div class="sub">Lista e ações</div>
                </div>
                <button class="btn btn-primary" id="btn-add-patient">+ Paciente</button>
              </div>

              <input id="filter-patient" type="text" placeholder="Procurar paciente" class="mt-12" />
              <div class="list" id="patients-list" aria-live="polite"></div>

              <div class="actions mt-12">
                <button class="btn btn-ghost" id="btn-logout">Sair</button>
              </div>
            </div>

            <div class="card mt-12">
              <strong>Medicamentos próximos</strong>
              <div class="sub">Próximas 24 horas</div>
              <div id="upcoming" class="mt-10"></div>
            </div>
          </aside>

          <section class="content">
            <div class="card">
              <div class="top">
                <div>
                  <h2 id="content-title">Dashboard</h2>
                  <div class="sub" id="content-sub">Selecione um paciente para gerenciar seus medicamentos.</div>
                </div>
                <div class="search">
                  <input id="global-search" type="text" placeholder="Pesquisar medicamentos..." />
                </div>
              </div>
              <div id="content-body" class="mt-12">
                <p class="sub">Nenhum paciente selecionado.</p>
              </div>
            </div>
            <div id="logs" class="mt-12"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <div id="modal-backdrop" class="modal-backdrop">
    <div class="modal" id="modal-content"></div>
  </div>

  <footer>Protótipo acadêmico — não utilizar em produção.</footer>

  <!-- Firebase App -->
<script type="module">
  // 
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, onSnapshot,
    doc, updateDoc, deleteDoc
  } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  // 
  const firebaseConfig = {
    apiKey: "AIzaSyCKZ7pwGCuD2yAyF8nA59YoPStXTAbqQbQ",
    authDomain: "extensionistaav.firebaseapp.com",
    projectId: "extensionistaav",
    storageBucket: "extensionistaav.firebasestorage.app",
    messagingSenderId: "762232026491",
    appId: "1:762232026491:web:122a21e6066ba69218b9de"
  };

  const app = initializeApp(firebaseConfig);
  export const db = getFirestore(app);
</script>

  <script src="script.js"></script>
</body>

</html>
